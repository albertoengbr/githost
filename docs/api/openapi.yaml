openapi: 3.0.3
info:
  title: GitHost API
  version: v1
  description: |
    GitHost's versioned REST API. Authentication uses access tokens with
    scopes (`repo:read`, `repo:write`, `admin`) via the
    `Authorization: token <value>` header (Bearer is also accepted).
    Private repositories answer 404 to unauthorized callers — the same
    response as nonexistent repositories.
servers:
  - url: /api/v1
security:
  - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: githost access token (ght_...)
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
    Repository:
      type: object
      properties:
        owner: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [private, public] }
        default_branch: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        clone_url: { type: string }
    Ref:
      type: object
      properties:
        name: { type: string }
        sha: { type: string }
        subject: { type: string }
        author: { type: string }
        when: { type: string, format: date-time }
    Commit:
      type: object
      properties:
        sha: { type: string }
        subject: { type: string }
        body: { type: string }
        parents: { type: array, items: { type: string } }
        author:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            time: { type: string, format: date-time }
        committer:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            time: { type: string, format: date-time }
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    perPage:
      name: per_page
      in: query
      schema: { type: integer, default: 30, maximum: 100 }

paths:
  /user:
    get:
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200": { description: OK }
        "401": { description: Unauthorized }
  /user/repos:
    get:
      operationId: listUserRepos
      summary: The authenticated user's repositories
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/perPage' }]
      responses:
        "200": { description: OK }
  /repos:
    get:
      operationId: listRepos
      summary: All repositories (admin scope) or the caller's own
      parameters: [{ $ref: '#/components/parameters/page' }, { $ref: '#/components/parameters/perPage' }]
      responses:
        "200": { description: OK }
    post:
      operationId: createRepo
      summary: Create a repository (repo:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [private, public] }
                default_branch: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Invalid input }
  /repos/{owner}/{repo}:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRepo
      summary: Repository details (visible to the caller)
      responses:
        "200": { description: OK }
        "404": { description: Not found (or private to the caller) }
    patch:
      operationId: updateRepo
      summary: Update repository settings (owner/admin, repo:write)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                visibility: { type: string, enum: [private, public] }
                default_branch: { type: string }
                archived: { type: boolean }
      responses:
        "200": { description: Updated }
        "400": { description: Invalid input }
        "403": { description: Not a manager }
    delete:
      operationId: deleteRepo
      summary: Delete the repository (owner/admin, repo:write)
      responses:
        "204": { description: Deleted }
        "403": { description: Not a manager }
  /repos/{owner}/{repo}/branches:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      operationId: listBranches
      summary: Branches
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /repos/{owner}/{repo}/tags:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTags
      summary: Tags
      responses:
        "200": { description: OK }
        "404": { description: Not found }
  /repos/{owner}/{repo}/commits:
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
      - { name: ref, in: query, schema: { type: string } }
      - { $ref: '#/components/parameters/page' }
      - { $ref: '#/components/parameters/perPage' }
    get:
      operationId: listCommits
      summary: Commit history of a ref (paginated)
      responses:
        "200": { description: OK }
        "404": { description: Not found }
