# GitHost configuration.
#
# Generated by `githost init`; edit and restart the server to apply changes.
# Every relative path is resolved against the directory containing this
# file.

server:
  # HTTP listen address. Use "0.0.0.0" to accept connections on all
  # interfaces (only on a trusted network or behind a reverse proxy).
  address: "127.0.0.1"
  http_port: 3000
  # Git-over-SSH transport (implemented in F1; the section exists so
  # configurations are forward-compatible).
  ssh:
    enabled: false
    address: "0.0.0.0"
    port: 2222
  # Native TLS (F3): when enabled, GitHost serves HTTPS directly and a
  # reverse proxy is no longer required.
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

paths:
  # Root data directory: database, secret key and (from F1) the bare Git
  # repositories, attachments and backups.
  data: "data"

database:
  # Only "sqlite" is supported in F0.
  driver: "sqlite"
  sqlite:
    # Empty means "<paths.data>/githost.db".
    path: ""

logging:
  # One of: debug, info, warn, error.
  level: "info"
  # One of: json, text.
  format: "json"

security:
  # Instance secret used to sign session cookies and tokens (F1+).
  # Empty means "<paths.data>/secret.key". This file must never be
  # committed or shared.
  secret_file: ""
  # Public self-registration is disabled by default. Create users with
  # `githost admin create-user` (F1).
  allow_registration: false

limits:
  # Maximum accepted pack size for pushes, in bytes (default 512 MiB).
  # Enforced by git itself (receive.maxInputSize) and by the HTTP layer.
  max_push_bytes: 536870912
