name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
        if: runner.os != 'Windows'
        shell: bash
      - name: go test
        run: go test ./...
      # The race detector needs a C toolchain on Windows runners and none
      # is guaranteed there; POSIX runners exercise it on every push.
      - name: go test -race
        run: go test -race ./...
        if: runner.os != 'Windows'
      - name: git version (diagnostics)
        run: git --version

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build matrix
        run: ./scripts/cross-compile.sh
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: githost-matrix
          path: dist/
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [test, cross]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build archives + checksums
        run: |
          ./scripts/cross-compile.sh
          ./scripts/package.sh
      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: githost-release
          path: dist/*.tar.gz
          if-no-files-found: error
