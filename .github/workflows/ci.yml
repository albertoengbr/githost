name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
        if: runner.os != 'Windows'
        shell: bash
      - name: go test
        run: go test ./...
      # The race detector needs a C toolchain on Windows runners and none
      # is guaranteed there; POSIX runners exercise it on every push.
      - name: go test -race
        run: go test -race ./...
        if: runner.os != 'Windows'
      - name: git version (diagnostics)
        run: git --version

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build matrix
        run: ./scripts/cross-compile.sh
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: githost-matrix
          path: dist/
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [test, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Full history so `git describe` resolves the release tag for the
      # version stamp baked into the binaries.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build archives + checksums
        run: ./scripts/package.sh
      - name: upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: githost-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
      # The release may be created a few seconds after the tag push that
      # starts this run, so retry until it exists.
      - name: attach assets to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt --clobber; then
              exit 0
            fi
            echo "release not ready yet (attempt $attempt); retrying in 10s"
            sleep 10
          done
          echo "could not attach assets after 6 attempts" >&2
          exit 1
